name: Diagnose (GDELT, Google News and URL probes)

# A read-only probe run by hand: how the GDELT DOC API answers Spanish and Portuguese queries, and whether
# Google News RSS search is allowed by robots.txt and what its items look like; with what=urls a plain GET of each URL, with
# what=mineral_images the lead pictures of the minerals' Wikipedia articles with their Commons licences. Writes nothing; the job log is the record.
on:
  workflow_dispatch:
    inputs:
      what:
        description: "gdelt | gnews | all | translingual | urls | mineral_images | place_images"
        default: "all"
      urls:
        description: "with what=urls: URLs to GET, one per line (status, type, size and the first characters are printed)"
        default: ""
      chars:
        description: "with what=urls: how many characters of each answer to print"
        default: "1500"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - if: ${{ inputs.what != 'urls' && inputs.what != 'mineral_images' && inputs.what != 'place_images' }}
        run: python -u scripts/gdelt_probe.py "${{ inputs.what || 'all' }}"
      - if: ${{ inputs.what == 'urls' }}
        env:
          HTTP_PROBE_URLS: ${{ inputs.urls }}
          HTTP_PROBE_CHARS: ${{ inputs.chars }}
        run: python -u scripts/http_probe.py
      - if: ${{ inputs.what == 'mineral_images' }}
        run: python -u scripts/mineral_images.py
      - if: ${{ inputs.what == 'place_images' }}
        run: python -u scripts/mineral_images.py --places
