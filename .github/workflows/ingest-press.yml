name: Ingest (press, weekly)

on:
  schedule:
    - cron: "37 4 * * 3"   # Wednesdays 04:37 UTC; feeds expose only recent items, so weekly keeps the headline record continuous
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  press:
    uses: ./.github/workflows/ingest-monthly.yml
    with:
      targets: press
      # Media Cloud (history, keyed) runs in the press group after the feeds and GDELT: 40 minutes of country-years per
      # week, newest first; the monthly workflow's defaults apply (mediacloud_time_budget_min, mediacloud_years)
      mediacloud_time_budget_min: "40"
    # every repository secret the monthly job's env block names (MEDIACLOUD_KEY, COMTRADE_KEY, ...) reaches it this way
    secrets: inherit
