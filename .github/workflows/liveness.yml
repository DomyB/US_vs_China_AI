name: Source liveness check

on:
  schedule:
    - cron: "23 5 * * 1"   # Mondays 05:23 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  liveness:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: python -m scm liveness
      - run: python scripts/build_sources.py
      - name: Commit liveness results
        run: |
          cd ..
          git config user.name "scm-bot"
          git config user.email "scm-bot@users.noreply.github.com"
          git add data/liveness.json SOURCES.md web/public/data/sources.json
          git diff --cached --quiet || git commit -m "data: liveness check $(date -u +%Y-%m-%d) [skip ci]"
          git push
