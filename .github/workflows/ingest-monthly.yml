name: Ingest (monthly)

on:
  schedule:
    - cron: "17 6 3 * *"   # 3rd of each month, 06:17 UTC
  workflow_dispatch:
    inputs:
      targets:
        description: "Adapters to run (space-separated source ids, or all / tier1 / legislature / press / national / monthly / annual; none = recompute, rebuild and re-export only)"
        default: "tier1 legislature national"
      fetch_only:
        description: "Only download raw snapshots (no parse)"
        type: boolean
        default: false
      gdelt_backfill_windows:
        description: "GDELT: how many missing historical windows to fetch this run (about 15 s each, more when throttled)"
        default: "60"
      gdelt_time_budget_min:
        description: "GDELT: minutes of fetching before the run stops and leaves the rest for next time"
        default: "45"
      gdelt_countries:
        description: "GDELT: ISO3 codes to fetch, in priority order (empty = all twelve)"
        default: ""
      gdelt_backlog_first:
        description: "GDELT: fetch the historical windows before the recent ones (a backfill on a throttled address then spends what it gets on history)"
        type: boolean
        default: false
      adapter_budget_min:
        description: "Minutes any single adapter may run before it is cut off (set above the GDELT budget for a backfill; 0 = no limit)"
        default: "120"
      allow_empty_warehouse:
        description: "Start from an empty warehouse when no usable data release exists (first run only)"
        type: boolean
        default: false
      allow_regression:
        description: "Accept a warehouse with fewer rows than the restored release (intentional: a source was cleared or re-scoped)"
        type: boolean
        default: false
  workflow_call:
    inputs:
      targets:
        type: string
        default: "annual"
      fetch_only:
        type: boolean
        default: false
      gdelt_backfill_windows:
        type: string
        default: "60"
      gdelt_time_budget_min:
        type: string
        default: "45"
      gdelt_countries:
        type: string
        default: ""
      gdelt_backlog_first:
        type: boolean
        default: false
      adapter_budget_min:
        type: string
        default: "120"
      allow_empty_warehouse:
        type: boolean
        default: false
      allow_regression:
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: ingest-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: pipeline
    env:
      COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
      CONGRESS_GOV_KEY: ${{ secrets.CONGRESS_GOV_KEY }}
      CENSUS_KEY: ${{ secrets.CENSUS_KEY }}
      CODF_DOWNLOAD_URL: ${{ secrets.CODF_DOWNLOAD_URL }}
      CGIT_FILE_URL: ${{ secrets.CGIT_FILE_URL }}
      EXIM_FILE_URL: ${{ secrets.EXIM_FILE_URL }}
      DPI_FILE_URL: ${{ secrets.DPI_FILE_URL }}
      GDELT_BACKFILL_WINDOWS: ${{ inputs.gdelt_backfill_windows || '60' }}
      GDELT_TIME_BUDGET_MIN: ${{ inputs.gdelt_time_budget_min || '45' }}
      GDELT_COUNTRIES: ${{ inputs.gdelt_countries || '' }}
      GDELT_BACKLOG_FIRST: ${{ inputs.gdelt_backlog_first && '1' || '' }}
      SCM_ADAPTER_BUDGET_MIN: ${{ inputs.adapter_budget_min || '120' }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: Restore the previous warehouse release
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW_EMPTY_WAREHOUSE: ${{ inputs.allow_empty_warehouse && 'true' || 'false' }}
        run: .github/scripts/restore_release.sh
      - name: Runner resources before ingestion
        run: df -h / && free -m
      - name: Run adapters
        id: run
        continue-on-error: true
        run: |
          python -u -m scm run ${{ inputs.targets || 'tier1 legislature national' }} ${{ inputs.fetch_only && '--fetch-only' || '' }} 2> ../ingest.log | tee ../ingest-results.jsonl
      - name: Runner resources after ingestion
        if: always()
        run: df -h / && free -m && du -sh ../data/raw/* 2>/dev/null | sort -h | tail -15
      - name: Record trimmed fixtures from the real responses
        run: python -m scm fixtures
      - name: Build warehouse and export site data
        run: |
          python -m scm analyse
          python -m scm build
          python -m scm export
      - name: Tests on the real fixtures
        id: tests
        continue-on-error: true
        run: pytest -q
      - name: Regenerate SOURCES.md and sources.json
        run: python scripts/build_sources.py
      - name: Guard - the warehouse must not have regressed against the restored release
        run: python -m scm stats --not-below /tmp/restored.json ${{ inputs.allow_regression && '--allow-regression' || '' }}
      - name: Commit data
        run: |
          cd ..
          git config user.name "scm-bot"
          git config user.email "scm-bot@users.noreply.github.com"
          git add web/public/data/real pipeline/tests/fixtures SOURCES.md web/public/data/sources.json
          git diff --cached --quiet || git commit -m "data: ingestion $(date -u +%Y-%m-%d) [skip ci]"
          git pull --rebase --autostash origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
      - name: Package Parquet release
        working-directory: ${{ github.workspace }}
        run: .github/scripts/package_release.sh
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Data release ${{ env.TAG }}
          body: "Parquet warehouse and DuckDB views produced by the ingestion workflow (restored from ${{ env.RESTORED_TAG || 'an empty warehouse' }}). Every table carries source, URL, retrieval date and reliability columns."
          files: warehouse-${{ env.TAG }}.tar.gz
      - name: Upload raw snapshots and logs (debugging)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ingest-${{ github.run_id }}
          path: |
            ingest.log
            ingest-results.jsonl
            data/raw/**/manifest.json
            data/raw/**/*.xml
          retention-days: 14
      - name: Open or update an issue on failure
        if: steps.run.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const lines = fs.readFileSync('ingest-results.jsonl', 'utf8').trim().split('\n').map(l => { try { return JSON.parse(l) } catch { return null } }).filter(Boolean);
            const summary = lines.find(l => l.failed) || {failed: []};
            const failed = summary.failed || [];
            const title = `Ingestion failure: ${failed.join(', ') || 'see log'}`;
            const body = `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nFailed adapters: ${failed.join(', ')}\n\n\`\`\`\n${lines.filter(l => l.status === 'failed').map(l => `${l.source_id}: ${l.error}`).join('\n').slice(0, 6000)}\n\`\`\``;
            const { data: issues } = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'ingestion' });
            const existing = issues.find(i => i.title.startsWith('Ingestion failure'));
            if (existing) {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['ingestion'] });
            }
      - name: Fail the job if adapters or tests failed
        if: steps.run.outcome == 'failure' || steps.tests.outcome == 'failure'
        run: |
          echo "adapters: ${{ steps.run.outcome }}, tests: ${{ steps.tests.outcome }}"
          exit 1
