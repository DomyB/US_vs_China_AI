name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (lint, typecheck, tests, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  pipeline:
    name: Pipeline (registry validation, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml pytest ruff
      - run: ruff check scripts tests
      - run: python scripts/build_sources.py
      - run: python scripts/make_sample_data.py
      - run: pytest -q
      - name: Generated files must be committed
        run: git diff --exit-code -- ../SOURCES.md ../web/public/data/sources.json
