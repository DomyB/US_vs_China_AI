# Source registry: international data (brief section 7a).
# Field reference in pipeline/config/sources/README.md.
sources:
  - id: un_comtrade
    name: UN Comtrade Plus
    url: https://comtradeplus.un.org
    api_url: https://comtradeapi.un.org
    category: trade
    scope: international
    reliability: official
    license: "UN data terms: free use with attribution; bulk redistribution restricted"
    access: api
    auth: "Free registered subscription key: 100,000 rows/call, 500 calls/day"
    update_frequency: continuous
    refresh_schedule: monthly
    coverage_from: 1988
    coverage_to: 2026
    language: en
    status: live
    verified_on: 2026-10-01
    verified_method: search
    python_package: comtradeapicall
    notes: "Primary trade source for all 12 countries (HS6, annual and monthly). China-reported data here is the proxy for GACC. Venezuela's own reports end around 2013; partner mirror data used after that."
  - id: imf_imts
    name: IMF International Merchandise Trade Statistics (IMTS, formerly Direction of Trade Statistics)
    url: https://data.imf.org/en/datasets/IMF.STA:IMTS
    api_url: https://api.imf.org/external/sdmx/3.0
    category: trade
    scope: international
    reliability: official
    license: "IMF data terms: free use with attribution"
    access: api
    auth: none
    update_frequency: monthly
    refresh_schedule: monthly
    coverage_from: 1948
    coverage_to: 2026
    language: en
    status: moved
    verified_on: 2026-10-01
    verified_method: search
    python_package: sdmx1
    notes: "Legacy DOTS portal retired Nov 2025; dataservices.imf.org no longer resolves. Bilateral totals used for cross-checks against Comtrade."
  - id: wto_stats
    name: WTO Stats / Timeseries API
    url: https://stats.wto.org
    api_url: https://api.wto.org/timeseries/v1
    category: trade
    scope: international
    reliability: official
    license: "WTO terms: free use with attribution"
    access: api
    auth: "Free subscription key"
    update_frequency: annual
    refresh_schedule: annual
    coverage_from: 1948
    coverage_to: 2025
    language: en
    status: live
    verified_on: 2026-10-01
    verified_method: search
    notes: "Tariffs and trade by product group; secondary."
  - id: usgs_mcs
    name: USGS Mineral Commodity Summaries
    url: https://www.usgs.gov/centers/national-minerals-information-center/mineral-commodity-summaries
