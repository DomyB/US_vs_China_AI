    license: public domain
    access: bulk
    auth: none
    update_frequency: annual
    refresh_schedule: annual
    coverage_from: 1996
    coverage_to: 2025
    language: en
    status: live
    verified_on: 2026-10-01
    verified_method: search
    notes: "2026 edition (data year 2025) released Feb 2026 with CSV/XLSX data release. World mine production and reserves by country; annual average prices (used for lithium)."
  - id: usgs_myb_latam
