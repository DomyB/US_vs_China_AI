# Explicit HS6 to mineral mapping (HS 2017 / HS 2022; none of these subheadings
# changed between editions). Verified against UNSD classification detail pages
# during Phase 0 (see docs/PHASE0_PLAN.md section 2.2).
#
# stage: ore | concentrate | intermediate | refined | product
# Codes marked shared=true cover more than one mineral or product and are
# labeled as such in the UI.

hs_codes:
  # Lithium
  - hs6: "283691"
    mineral: lithium
    stage: intermediate
    description: "Lithium carbonates"
  - hs6: "282520"
    mineral: lithium
    stage: intermediate
    description: "Lithium oxide and hydroxide"
    shared: true
    note: "Oxide and hydroxide share one subheading; cannot separate LiOH."
  - hs6: "280519"
    mineral: lithium
    stage: refined
    description: "Alkali metals other than sodium (includes lithium metal)"
    shared: true
  - hs6: "253090"
    mineral: lithium
    stage: ore
    description: "Mineral substances n.e.s. (spodumene concentrate is commonly declared here)"
    shared: true
    note: "There is no dedicated HS6 code for lithium ores; flows under 2530.90 are a noisy proxy and are labeled as such."
