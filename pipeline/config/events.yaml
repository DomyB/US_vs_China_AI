# Dated policy events for the Phase 4b event studies and difference-in-differences designs.
#
# DRAFT for the owner's review. Phase 4b will read only events whose `status` is `reviewed`; `draft` rows
# are listed for checking. Every event needs a date, the actor whose policy it is (US, CN, or the ISO3 of the
# country whose own policy it is), the countries it is expected to touch (`scope: all` for the twelve), the
# registry source id that documents it (`pipeline/config/sources/*.yaml`) and, when the exact document or
# date still needs confirming, `verify: true` with a note saying what to check. Nothing here is used by the
# site or the index until reviewed.
#
# Fields: id, date (YYYY-MM-DD), date_precision (day|month), actor, scope (all | [ISO3, ...]), type
# (export_control | tariff | sanction | law | strategy | agreement | political | contract), title, source_id,
# url (optional, only when a stable official URL is known), note, status (draft|reviewed), verify (bool).

