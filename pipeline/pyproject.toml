[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scm-pipeline"
version = "0.1.0"
description = "Data pipelines and models for the US-China critical minerals in South America platform"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
    "pandas>=2.2",
    "pyarrow>=15",
    "duckdb>=1.0",
    "openpyxl>=3.1",
    "pandera>=0.20",
    "pyreadr>=0.5",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
include = ["scm*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_sample_data.py" = ["E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
