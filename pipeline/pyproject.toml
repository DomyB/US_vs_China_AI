[project]
name = "scm-pipeline"
version = "0.1.0"
description = "Data pipelines and models for the US-China critical minerals in South America platform"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/make_sample_data.py" = ["E702"]

[tool.pytest.ini_options]
testpaths = ["tests"]
