<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Social image</title>
<style>
  /* The light-scheme tokens of src/app/globals.css are inserted here by scripts/render-og.mjs. */
  /*TOKENS*/
  :root { --font-serif: "Liberation Serif", Georgia, "Times New Roman", serif; --font-sans: "Liberation Sans", Arial, sans-serif; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { width: 1200px; height: 630px; overflow: hidden; background: var(--surface); color: var(--ink); font-family: var(--font-sans); }
  .frame { position: relative; display: grid; grid-template-columns: minmax(0, 1fr) 430px; gap: 44px; align-items: center; width: 1200px; height: 630px; padding: 56px 64px; }
  .grid { position: absolute; inset: 0; background-image: linear-gradient(var(--rule) 1px, transparent 1px), linear-gradient(90deg, var(--rule) 1px, transparent 1px); background-size: 40px 40px; opacity: 0.55; }
  .text { position: relative; }
  .brand { display: flex; align-items: center; gap: 16px; margin-bottom: 34px; }
  .tile { display: grid; grid-template-columns: 1fr 1fr; width: 60px; height: 60px; flex: none; border: 4px solid var(--outline); border-radius: 14px; overflow: hidden; background: var(--card); box-shadow: 4px 4px 0 var(--shadow-hard); }
  .tile i { display: block; }
  .tile .us { background: var(--us); } .tile .s { background: var(--surface-2); } .tile .cn { background: var(--cn); }
  .name { font: 700 26px/1.15 var(--font-sans); }
  .sub { margin-top: 4px; font: 400 20px/1.3 var(--font-sans); color: var(--ink-3); }
  h1 { margin: 0 0 20px; font: 700 56px/1.05 var(--font-serif); letter-spacing: -0.012em; }
  p { margin: 0; max-width: 580px; font: 400 23px/1.4 var(--font-sans); color: var(--ink-2); }
  .tags { display: flex; gap: 10px; margin-top: 26px; }
  .tag { padding: 9px 14px; border: 2px solid currentColor; border-radius: 999px; background: var(--card); font: 700 14px/1 var(--font-sans); letter-spacing: 0.06em; text-transform: uppercase; }
  .facts { color: var(--facts); } .model { color: var(--model); } .interp { color: var(--interp); }
  .art { position: relative; padding: 22px; border: 4px solid var(--outline); border-radius: 24px; background: var(--card); box-shadow: 8px 8px 0 var(--shadow-hard); }
  .art svg { display: block; width: 100%; height: auto; }
</style>
</head>
<body>
  <div class="frame">
    <div class="grid"></div>
    <div class="text">
      <div class="brand">
        <div class="tile"><i class="us"></i><i class="s"></i><i class="s"></i><i class="cn"></i></div>
        <div><div class="name">US–China Critical Minerals Tracker</div><div class="sub">South America · 12 countries · 2008–2026</div></div>
      </div>
      <h1>Who is gaining ground, where, and in which minerals?</h1>
      <p>Sourced trade, finance, debt, votes and legislative records, with every number linked to its source.</p>
      <div class="tags"><span class="tag facts">Facts</span><span class="tag model">Model output</span><span class="tag interp">Interpretation</span></div>
    </div>
    <div class="art"><!--HERO--></div>
  </div>
</body>
</html>
